server:
  port: 8083

spring:
  application:
    name: merchant-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/quickwallet-merchant
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
